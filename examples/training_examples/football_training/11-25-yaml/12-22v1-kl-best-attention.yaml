# 只使用线性退火
defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "11-25-footballtrain"

lr: 85e-6

experiment:
  task_factory:
    name: ImitationFactory
    params:
      custom_dataset_conf:
        traj: null
        
  env_params:
    env_name: MjxUnitreeG1
    headless: True
    disable_arms: false
    horizon: 260
    spec: "/home/user/loco-mujoco/loco_mujoco/models/unitree_g1/g1_29dof.xml"
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: false
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.7
      qvel_w_sum: 0.34
      rpos_w_sum: 0.8
      rquat_w_sum: 0.5
      rvel_w_sum: 0.24
      upper_body_stability_w: 0.3
      waist_stability_w: 0.2

      sites_for_mimic:
        - upper_body_mimic
        - left_hand_mimic
        - left_foot_mimic
        - right_hand_mimic
        - right_foot_mimic
        
  # PPO 超参数
  hidden_layers: [1024, 512, 512, 256, 256]
  lr: 85e-6
  num_envs: 4096
  num_steps: 200
  total_timesteps: 400e6
  update_epochs: 8
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.15
  learnable_std: true
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: elu
  anneal_lr: true
  weight_decay: 1e-5
  normalize_env: true
  debug: false
  n_seeds: 1
  vmap_across_seeds: true
  
  # ⭐⭐⭐ 改进的网络架构配置 ⭐⭐⭐
  use_improved_network: true  # 启用改进的网络架构
  
  # 传统注意力机制（建议关闭）
  use_residual: false
  use_attention: false
  attention_embed_dim: 128  # 提高嵌入维度
  
  # ⭐ 分组注意力配置（推荐开启）
  use_grouped_attention: true  # 启用分组注意力机制
  
  # ⭐ 通道注意力配置（推荐开启）
  use_channel_attention: true  # 启用通道注意力
  channel_attention_layers: [0, 2]  # 在第1层和第3层后添加
  channel_reduction_ratio: 64  # 通道压缩比例

  kl_adaptive_lr:
    active: false
    desired_kl: 0.023
    factor: 1.08
    min_lr: 1e-5
    max_lr: 3e-3

  # 验证配置
  validation:
    active: true
    num_steps: 100
    num_envs: 100
    num: 30
    quantities:
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - upper_body_mimic
      - left_hand_mimic
      - left_foot_mimic
      - right_hand_mimic
      - right_foot_mimic
    joints_to_ignore:
      - pelvis_tx
      - pelvis_tz
      - pelvis_ty
      - pelvis_tilt
      - pelvis_list
      - pelvis_rotation

control_config:
  torque_control:
    control_type: DefaultControl
    control_params:
      max_torque: 1
      min_torque: -1